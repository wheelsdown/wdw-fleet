name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wdwfleet
          POSTGRES_PASSWORD: wdwfleet
          POSTGRES_DB: wdwfleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wdwfleet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files need gofmt:" >&2
            echo "$fmt_out" >&2
            exit 1
          fi

      - name: generate-check (openapigen drift gate)
        run: |
          go generate ./...
          if ! git diff --quiet -- internal/server/api/spec; then
            echo "openapi spec is out of date; run 'just generate' and commit"
            git --no-pager diff -- internal/server/api/spec
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # Build golangci-lint from source with the runner's Go so
          # its Go version matches go.mod's (avoids "linter built with
          # go1.24 refuses to lint go1.26.1 code" errors).
          install-mode: goinstall

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
        env:
          WDW_DATABASE_URL: postgres://wdwfleet:wdwfleet@localhost:5432/wdwfleet?sslmode=disable

      - name: Build
        run: go build -o /dev/null ./cmd/wdw-fleet
