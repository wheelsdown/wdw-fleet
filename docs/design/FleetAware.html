  <title>FleetAware · Mid-fi prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; width: 100%; background: #f7f4ed; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: #15181a; }
  </style>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body>
  <div id="root"></div>
  <script>
    window.addEventListener('error', e => {
      console.error('CAUGHT:', e.message, 'at', e.filename + ':' + e.lineno + ':' + e.colno, e.error && e.error.stack);
      const d = document.getElementById('root');
      if (d && !d.hasChildNodes()) d.innerHTML = '<pre style="padding:20px;font-family:monospace;color:#b03a2e;white-space:pre-wrap;font-size:11px">' + (e.message || '?') + '\n' + (e.error && e.error.stack || '') + '</pre>';
    });
  </script>
  <script type="text/babel" data-presets="react">

// ═══════════════════ midfi/tokens.jsx ═══════════════════
// WDW Fleet · mid-fi design tokens + shared UI
// Palette: teal primary, orange accent, near-black ink, warm paper neutrals.
// Type: Inter for UI, JetBrains Mono for data/tabular.

// Base palettes — WDW is mutated by applyPalette() to match user theme + site colors.
const WDW_LIGHT = {
  teal:       '#1f7a7f',
  tealDeep:   '#155256',
  tealSoft:   '#e6f2f2',
  orange:     '#e85c2b',
  orangeSoft: '#fbe5db',
  ink:        '#15181a',
  ink2:       '#2a2e31',
  ink3:       '#4a4f54',
  muted:      '#7a7f85',
  faint:      '#c5c9cd',
  line:       '#e4e1d9',
  lineStrong: '#cfcac0',
  paper:      '#f7f4ed',
  paperAlt:   '#eeeae1',
  card:       '#ffffff',
  good:       '#2f7d4a',
  warn:       '#b97a0e',
  bad:        '#b03a2e',
};
const WDW_DARK = {
  teal:       '#4fb6bb',
  tealDeep:   '#7fd1d5',
  tealSoft:   '#1e383a',
  orange:     '#f07a4d',
  orangeSoft: '#3a241a',
  ink:        '#ece8dc',
  ink2:       '#d8d3c4',
  ink3:       '#a49f93',
  muted:      '#7a7770',
  faint:      '#4a4f54',
  line:       '#2e3336',
  lineStrong: '#3f4549',
  paper:      '#14171a',
  paperAlt:   '#1b1f22',
  card:       '#22272a',
  good:       '#6abe87',
  warn:       '#e0a94e',
  bad:        '#e07b6a',
};
const WDW = {
  ...WDW_LIGHT,
  sans: 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
  mono: '"JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace',
};

// Site + user config live on window so any component can read them.
const SITE_CONFIG_DEFAULT = {
  siteTitle:    'FleetAware',
  tagline:      'Wheels Down Workshop',
  primaryColor: null,   // null = use palette default (teal)
  accentColor:  null,
};
const USER_PROFILE_DEFAULT = {
  name:     'Jack Holloway',
  email:    'jack@macnugget.org',
  initials: 'JB',
  avatar:   null,       // data URL or null → fall back to initials on teal disc
  theme:    'auto',     // light | dark | auto
  density:  'comfortable',
  isAdmin:  true,
};
const loadJson = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ? { ...d, ...v } : { ...d }; } catch { return { ...d }; } };
window.__siteConfig  = loadJson('wdw_site_config',  SITE_CONFIG_DEFAULT);
window.__userProfile = loadJson('wdw_user_profile', USER_PROFILE_DEFAULT);

function resolvePalette(userTheme, siteConfig) {
  const systemDark = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const effective = userTheme === 'auto' ? (systemDark ? 'dark' : 'light') : userTheme;
  const base = effective === 'dark' ? WDW_DARK : WDW_LIGHT;
  const out = { ...base };
  if (siteConfig && siteConfig.primaryColor) { out.teal = siteConfig.primaryColor; out.tealDeep = siteConfig.primaryColor; }
  if (siteConfig && siteConfig.accentColor)  { out.orange = siteConfig.accentColor; }
  out.__effective = effective;
  return out;
}

function applyPalette(palette) {
  Object.assign(WDW, palette);
  if (typeof document !== 'undefined') {
    document.documentElement.dataset.wdwTheme = palette.__effective || 'light';
    rebuildWdwStyles();
  }
}

// Inject fonts once
if (typeof document !== 'undefined' && !document.getElementById('wdw-font-link')) {
  const fl = document.createElement('link');
  fl.rel = 'stylesheet';
  fl.id = 'wdw-font-link';
  fl.href = 'https://fonts.bunny.net/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap';
  document.head.appendChild(fl);
}

// Re-inject the WDW stylesheet whenever the palette changes. All rules below read
// from the live WDW object, so swapping palette → rebuilding styles → visually consistent.
function rebuildWdwStyles() {
  if (typeof document === 'undefined') return;
  let s = document.getElementById('wdw-styles');
  if (!s) {
    s = document.createElement('style');
    s.id = 'wdw-styles';
    document.head.appendChild(s);
  }
  s.textContent = `
    .wdw { font-family: ${WDW.sans}; color: ${WDW.ink}; background: ${WDW.paper}; height: 100%; width: 100%; position: relative; overflow: hidden; font-feature-settings: 'cv11','ss01','ss03'; }
    .wdw *, .wdw *::before, .wdw *::after { box-sizing: border-box; }
    .wdw-mono { font-family: ${WDW.mono}; font-feature-settings: 'zero','ss01'; }

    /* type scale */
    .wdw-h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.2; }
    .wdw-h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.1px; line-height: 1.25; }
    .wdw-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: ${WDW.muted}; }
    .wdw-body { font-size: 13px; line-height: 1.45; }
    .wdw-small { font-size: 12px; }
    .wdw-tiny { font-size: 11px; }
    .wdw-muted { color: ${WDW.muted}; }
    .wdw-faint { color: ${WDW.faint}; }

    /* rows */
    .wdw-row { display: flex; align-items: center; gap: 8px; }
    .wdw-col { display: flex; flex-direction: column; }

    /* surfaces */
    .wdw-card { background: ${WDW.card}; border: 1px solid ${WDW.line}; border-radius: 6px; }
    .wdw-card-soft { background: ${WDW.paper}; border: 1px solid ${WDW.line}; border-radius: 6px; }
    .wdw-divider { height: 1px; background: ${WDW.line}; width: 100%; }

    /* buttons */
    .wdw-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 5px; font-size: 12.5px; font-weight: 500; border: 1px solid ${WDW.lineStrong}; background: ${WDW.card}; color: ${WDW.ink}; cursor: pointer; line-height: 1; height: 30px; font-family: inherit; }
    .wdw-btn:hover { border-color: ${WDW.ink3}; }
    .wdw-btn-primary { background: ${WDW.teal}; color: #fff; border-color: ${WDW.teal}; }
    .wdw-btn-primary:hover { background: ${WDW.tealDeep}; border-color: ${WDW.tealDeep}; }
    .wdw-btn-accent { background: ${WDW.orange}; color: #fff; border-color: ${WDW.orange}; }
    .wdw-btn-ghost { background: transparent; border-color: transparent; color: ${WDW.ink3}; }
    .wdw-btn-ghost:hover { background: ${WDW.paperAlt}; }
    .wdw-btn-sm { padding: 4px 8px; font-size: 11.5px; height: 24px; }

    /* pills, chips, tags */
    .wdw-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid ${WDW.lineStrong}; background: ${WDW.card}; color: ${WDW.ink3}; }
    .wdw-pill-teal { background: ${WDW.tealSoft}; color: ${WDW.tealDeep}; border-color: transparent; }
    .wdw-pill-orange { background: ${WDW.orangeSoft}; color: ${WDW.orange}; border-color: transparent; }
    .wdw-pill-good { color: ${WDW.good}; border-color: ${WDW.good}; }
    .wdw-pill-warn { color: ${WDW.warn}; border-color: ${WDW.warn}; }
    .wdw-pill-bad { color: ${WDW.bad}; border-color: ${WDW.bad}; }
    .wdw-chip { display: inline-block; padding: 1px 5px; font-size: 10px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; background: ${WDW.paperAlt}; color: ${WDW.ink3}; border-radius: 3px; }

    /* status dots */
    .wdw-dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; display: inline-block; }

    /* inputs */
    .wdw-input { height: 30px; padding: 0 10px; border: 1px solid ${WDW.lineStrong}; border-radius: 5px; background: ${WDW.card}; font-family: inherit; font-size: 13px; color: ${WDW.ink}; width: 100%; }
    .wdw-input:focus { outline: none; border-color: ${WDW.teal}; box-shadow: 0 0 0 3px ${WDW.tealSoft}; }

    /* photo placeholder */
    .wdw-photo {
      background:
        linear-gradient(135deg, ${WDW.paperAlt} 25%, transparent 25%) 0 0 / 12px 12px,
        linear-gradient(135deg, transparent 75%, ${WDW.paperAlt} 75%) 6px 6px / 12px 12px,
        ${WDW.paper};
      border: 1px solid ${WDW.line};
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      color: ${WDW.muted}; font-size: 11px;
    }

    /* hover affordance */
    .wdw-click { cursor: pointer; transition: background .1s, border-color .1s; }
    .wdw-click:hover { background: ${WDW.paperAlt}; }

    /* scrollbar hygiene */
    .wdw *::-webkit-scrollbar { width: 8px; height: 8px; }
    .wdw *::-webkit-scrollbar-thumb { background: ${WDW.faint}; border-radius: 4px; }
    .wdw *::-webkit-scrollbar-track { background: transparent; }
  `;
}

// initial paint
applyPalette(resolvePalette(window.__userProfile.theme, window.__siteConfig));

// — User avatar (image or initials) —
function UserAvatar({ user, size = 30, style }) {
  const u = user || window.__userProfile;
  const common = {
    width: size, height: size, borderRadius: size / 2,
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    overflow: 'hidden', flexShrink: 0, ...style,
  };
  if (u.avatar) {
    return <img src={u.avatar} alt={u.name} style={{ ...common, objectFit: 'cover', background: WDW.paperAlt }} />;
  }
  return (
    <div style={{
      ...common,
      background: WDW.teal, color: '#fff',
      fontSize: Math.max(10, size * 0.38), fontWeight: 600, letterSpacing: 0.2,
    }}>{u.initials || '?'}</div>
  );
}

// — Avatar menu (profile/theme/admin) —
function AvatarMenu({ onNav }) {
  const [open, setOpen] = React.useState(false);
  const [, force] = React.useReducer(x => x + 1, 0);
  const menuRef = React.useRef(null);
  const user = window.__userProfile;

  React.useEffect(() => {
    if (!open) return;
    const onDown = (e) => {
      if (menuRef.current && !menuRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [open]);

  const setTheme = (t) => {
    window.__userProfile = { ...user, theme: t };
    localStorage.setItem('wdw_user_profile', JSON.stringify(window.__userProfile));
    applyPalette(resolvePalette(t, window.__siteConfig));
    if (window.__rerenderApp) window.__rerenderApp();
    force();
  };

  const themes = [
    ['light', 'Light'],
    ['dark',  'Dark'],
    ['auto',  'Auto'],
  ];

  return (
    <div style={{ position: 'relative' }} ref={menuRef}>
      <div onClick={() => setOpen(!open)} className="wdw-click" style={{
        outline: open ? `2px solid ${WDW.tealSoft}` : 'none', outlineOffset: 2, borderRadius: 15, cursor: 'pointer',
      }}>
        <UserAvatar user={user} size={30} />
      </div>

      {open && (
        <div style={{
          position: 'absolute', top: 40, right: 0, zIndex: 40,
          width: 240, background: WDW.card, borderRadius: 8,
          border: `1px solid ${WDW.line}`, boxShadow: '0 12px 28px rgba(0,0,0,0.18)',
          overflow: 'hidden', color: WDW.ink, fontFamily: WDW.sans,
        }}>
          <div style={{ padding: '12px 14px', borderBottom: `1px solid ${WDW.line}` }}>
            <div className="wdw-small" style={{ fontWeight: 600 }}>{user.name}</div>
            <div className="wdw-tiny wdw-muted wdw-mono" style={{ fontSize: 11, marginTop: 2 }}>{user.email}</div>
            {user.isAdmin && <div style={{ marginTop: 6 }}><span className="wdw-chip" style={{ background: WDW.tealSoft, color: WDW.tealDeep }}>Admin</span></div>}
          </div>

          <div style={{ padding: 6 }}>
            <div onClick={() => { setOpen(false); onNav && onNav('Profile'); }} className="wdw-click" style={{ padding: '8px 10px', borderRadius: 4, fontSize: 13, display: 'flex', alignItems: 'center', gap: 8 }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Profile & preferences
            </div>
            {user.isAdmin && (
              <div onClick={() => { setOpen(false); onNav && onNav('Admin'); }} className="wdw-click" style={{ padding: '8px 10px', borderRadius: 4, fontSize: 13, display: 'flex', alignItems: 'center', gap: 8 }}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Site administration
              </div>
            )}
          </div>

          <div style={{ padding: '8px 10px 12px', borderTop: `1px solid ${WDW.line}` }}>
            <div className="wdw-eyebrow" style={{ fontSize: 10, marginBottom: 6 }}>Theme</div>
            <div style={{ display: 'flex', gap: 2, padding: 2, background: WDW.paperAlt, borderRadius: 5 }}>
              {themes.map(([k, label]) => (
                <div key={k} onClick={() => setTheme(k)} className="wdw-click" style={{
                  flex: 1, textAlign: 'center', padding: '4px 6px', borderRadius: 3, fontSize: 11.5, fontWeight: 500,
                  background: user.theme === k ? WDW.card : 'transparent',
                  color: user.theme === k ? WDW.ink : WDW.ink3,
                  boxShadow: user.theme === k ? '0 1px 2px rgba(0,0,0,0.06)' : 'none',
                }}>{label}</div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// — Status dot + helper —

    <svg width={size} height={size * 0.55} viewBox="0 0 80 44" style={{ display: 'block' }}>
      {paths[type]}
    </svg>
  );
}

// — Photo placeholder with glyph —
function PhotoHolder({ w, h, glyph, label, style = {} }) {
  const numW = typeof w === 'number' ? w : 160;
  const numH = typeof h === 'number' ? h : 90;
  const glyphSize = Math.min(numW, numH) * 0.6;
  return (
    <div className="wdw-photo" style={{ width: w, height: h, flexDirection: 'column', gap: 4, ...style }}>
      {glyph && <VGlyph type={glyph} size={glyphSize} color={WDW.faint} />}
      {label && <span style={{ color: WDW.muted, fontSize: 10, letterSpacing: 0.3, textTransform: 'uppercase' }}>{label}</span>}
    </div>
  );
}

function ExpensesScreen({ onOpenVehicle, onOpenUnfiled, onLogTask }) {
  const [category, setCategory] = React.useState('All');
  const [vehicleFilter, setVehicleFilter] = React.useState('All');
  const all = window.EXPENSES;
  const fleet = window.FLEET;
  const vName = (id) => (fleet.find(v => v.id === id) || {}).name || id;
  const vGlyph = (id) => (fleet.find(v => v.id === id) || {}).glyph || 'car';

  const cats = ['fuel','maintenance','insurance','registration','tax','depreciation','financing','tolls','parking','track_fees','tires','other'];
  const catLabel = { fuel: 'Fuel', maintenance: 'Maintenance', insurance: 'Insurance', registration: 'Registration', tax: 'Tax', depreciation: 'Depreciation', financing: 'Financing', tolls: 'Tolls', parking: 'Parking/Storage', track_fees: 'Track fees', tires: 'Tires', other: 'Other' };

  const filtered = all.filter(e => {
    if (category !== 'All' && e.category !== category) return false;
    if (vehicleFilter !== 'All' && e.vehicleId !== vehicleFilter) return false;
    return true;
  });

  const total = filtered.reduce((a, e) => a + e.cost, 0);
  const byCat = {};
  filtered.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.cost; });
  const topCats = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 5);

  return (
    <div className="wdw" style={{ display: 'flex', flexDirection: 'column' }}>
      <WdwTopNav active="Reports" onCmd={onOpenUnfiled} />
      <div style={{ flex: 1, overflow: 'auto', padding: '20px 28px 32px' }}>
        <div className="wdw-row" style={{ justifyContent: 'space-between', marginBottom: 18 }}>
          <div>
            <div className="wdw-h1">Expenses</div>
            <div className="wdw-small wdw-muted" style={{ marginTop: 2 }}>{all.length} entries · all vehicles · last 12 months</div>
          </div>
          <div className="wdw-row" style={{ gap: 8 }}>
            <div className="wdw-btn">Export CSV</div>
            <div className="wdw-btn wdw-btn-primary" onClick={onLogTask}>{I.plus} Log expense</div>
          </div>
        </div>

        {/* KPI row */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 2.4fr', gap: 12, marginBottom: 18 }}>
          <div className="wdw-card" style={{ padding: '14px 16px' }}>
            <div className="wdw-eyebrow">Filtered total</div>
            <div className="wdw-mono" style={{ fontSize: 26, fontWeight: 500, marginTop: 6 }}>${total.toLocaleString()}</div>
            <div className="wdw-tiny wdw-muted" style={{ marginTop: 2 }}>{filtered.length} entries</div>
          </div>
          <div className="wdw-card" style={{ padding: '14px 16px' }}>
            <div className="wdw-eyebrow">By category</div>
            <div className="wdw-col" style={{ gap: 4, marginTop: 8 }}>
              {topCats.map(([c, v]) => (
                <div key={c} className="wdw-row wdw-small" style={{ gap: 8 }}>
                  <div style={{ width: 120 }}>{catLabel[c] || c}</div>
                  <div style={{ flex: 1, height: 6, background: WDW.paperAlt, borderRadius: 3, overflow: 'hidden' }}>
                    <div style={{ width: `${Math.round(v / total * 100)}%`, height: '100%', background: WDW.teal }} />
                  </div>
                  <div className="wdw-mono wdw-tiny" style={{ width: 70, textAlign: 'right' }}>${v.toLocaleString()}</div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Filters */}
        <div className="wdw-row" style={{ gap: 8, marginBottom: 12, flexWrap: 'wrap' }}>
          <div className="wdw-row" style={{ gap: 6 }}>
            {['All', ...cats].map(c => (
              <div key={c} onClick={() => setCategory(c)} className="wdw-click" style={{
                padding: '4px 10px', borderRadius: 4, fontSize: 12, fontWeight: 500,
                background: category === c ? WDW.ink : 'transparent',
                color: category === c ? '#fff' : WDW.ink3,
                border: `1px solid ${category === c ? WDW.ink : WDW.line}`,
              }}>{c === 'All' ? 'All' : (catLabel[c] || c)}</div>
            ))}
          </div>
        </div>
        <div className="wdw-row" style={{ gap: 8, marginBottom: 12 }}>
          <span className="wdw-tiny wdw-muted">Vehicle:</span>
          <div onClick={() => setVehicleFilter('All')} className="wdw-click wdw-small" style={{ padding: '3px 8px', borderRadius: 3, background: vehicleFilter === 'All' ? WDW.paperAlt : 'transparent', fontWeight: vehicleFilter === 'All' ? 500 : 400 }}>All vehicles</div>
          {fleet.map(v => (
            <div key={v.id} onClick={() => setVehicleFilter(v.id)} className="wdw-click wdw-small" style={{ padding: '3px 8px', borderRadius: 3, background: vehicleFilter === v.id ? WDW.paperAlt : 'transparent', fontWeight: vehicleFilter === v.id ? 500 : 400 }}>{v.name}</div>
          ))}
        </div>

        {/* Table */}
        <div className="wdw-card" style={{ overflow: 'hidden' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '100px 150px 120px 2fr 1fr 100px 60px', padding: '8px 14px', borderBottom: `1px solid ${WDW.line}`, background: WDW.paper }}>
            {['Date', 'Vehicle', 'Category', 'Description', 'Vendor', 'Amount', ''].map(h => <div key={h} className="wdw-eyebrow" style={{ textAlign: h === 'Amount' ? 'right' : 'left' }}>{h}</div>)}
          </div>
          {filtered.map((e, i) => (
            <div key={e.id} className="wdw-click" onClick={() => onOpenVehicle(e.vehicleId)} style={{
              display: 'grid', gridTemplateColumns: '100px 150px 120px 2fr 1fr 100px 60px',
              padding: '10px 14px', borderTop: i === 0 ? 'none' : `1px solid ${WDW.line}`, alignItems: 'center', gap: 8,
            }}>
              <div className="wdw-small wdw-mono wdw-muted">{e.date}</div>
              <div className="wdw-row" style={{ gap: 6 }}>
                <VGlyph type={vGlyph(e.vehicleId)} size={22} color={WDW.ink3} />
                <div className="wdw-small" style={{ fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{vName(e.vehicleId)}</div>
              </div>
              <div><span className="wdw-chip">{catLabel[e.category] || e.category}</span></div>
              <div className="wdw-small">{e.description}</div>
              <div className="wdw-small wdw-muted">{e.vendor}</div>
              <div className="wdw-mono wdw-small" style={{ textAlign: 'right', fontWeight: 500 }}>${e.cost.toLocaleString()}</div>
              <div className="wdw-tiny wdw-muted" style={{ textAlign: 'right' }}>{e.recurring ? 'recur' : ''}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function AvatarUploader({ user, onChange }) {
  const fileRef = React.useRef(null);
  const [busy, setBusy] = React.useState(false);

  const onPick = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 2 * 1024 * 1024) {
      alert('Please pick an image under 2 MB.');
      return;
    }
    setBusy(true);
    const reader = new FileReader();
    reader.onload = () => {
      const src = reader.result;
      // Scale + re-encode to keep localStorage happy.
      const img = new Image();
      img.onload = () => {
        const max = 256;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try {
          const out = canvas.toDataURL('image/jpeg', 0.88);
          onChange(out);
        } catch (err) {
          onChange(src); // fall back to original (e.g. SVG)
        }
        setBusy(false);
        if (fileRef.current) fileRef.current.value = '';
      };
      img.onerror = () => {
        // Not raster — SVG etc. Pass through.
        onChange(src);
        setBusy(false);
        if (fileRef.current) fileRef.current.value = '';
      };
      img.src = src;
    };
    reader.readAsDataURL(f);
  };

  return (
    <div className="wdw-row" style={{ gap: 14, alignItems: 'center' }}>
      <UserAvatar user={user} size={56} />
      <div className="wdw-col" style={{ gap: 6 }}>
        <div className="wdw-row" style={{ gap: 6 }}>
          <div className="wdw-btn wdw-btn-sm" onClick={() => fileRef.current && fileRef.current.click()}>
            {busy ? 'Processing…' : (user.avatar ? 'Replace…' : 'Upload image…')}
          </div>
          {user.avatar && (
            <div className="wdw-btn wdw-btn-sm" onClick={() => onChange(null)} style={{ color: WDW.bad, borderColor: WDW.bad }}>Remove</div>
          )}
        </div>
        <div className="wdw-tiny wdw-muted">
          {user.avatar
            ? 'Falls back to initials anywhere the image can’t be shown.'
            : 'Using initials “' + (user.initials || '??') + '” on a teal disc.'}
        </div>
      </div>
      <input ref={fileRef} type="file" accept="image/*" onChange={onPick} style={{ display: 'none' }} />
    </div>
  );
}

          }
        };
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);
      const [toast, setToast] = useState(null);

      useEffect(() => { localStorage.setItem(KEY, JSON.stringify(route)); }, [route]);
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      const { FleetScreen, VehicleScreen, LogTaskScreen, FuelScreen, PartsScreen, InboxScreen, RemindersScreen, ExpensesScreen, SettingsScreen, ProfileScreen, WDW, I } = window;
      const go = (screen, extra = {}) => setRoute({ screen, ...extra });
      useEffect(() => {
        window.__wdwNav = (label) => {
          const m = { 'Fleet': 'fleet', 'Reminders': 'reminders', 'Parts': 'parts', 'Unfiled': 'inbox', 'Reports': 'expenses', 'Profile': 'profile', 'Admin': 'admin', 'Settings': 'admin' };
          if (m[label]) go(m[label]);
          else setToast(label + ' screen not yet implemented');
        };
      }, []);

      const ctx = {
        onOpenVehicle: (id) => go('vehicle', { vehicleId: id }),
        onBack:        () => go('fleet'),
        onLogTask:     () => setOverlay('log'),
        onOpenUnfiled:   () => go('inbox'),
        onOpenDoc:     () => setToast('Document preview not wired — demo only'),
      };

      return (
        <div style={{ position: 'relative', height: '100%', width: '100%' }}>
          {route.screen === 'fleet'   && <FleetScreen {...ctx} />}
          {route.screen === 'vehicle' && <VehicleScreen vehicleId={route.vehicleId} {...ctx} />}
          {route.screen === 'parts'   && <PartsScreen {...ctx} />}
          {route.screen === 'inbox'   && <InboxScreen {...ctx} />}
          {route.screen === 'reminders' && <RemindersScreen {...ctx} />}
          {route.screen === 'expenses'  && <ExpensesScreen {...ctx} />}
          {route.screen === 'settings' && <SettingsScreen {...ctx} />}
          {route.screen === 'admin'    && <SettingsScreen {...ctx} />}
          {route.screen === 'profile'  && <ProfileScreen {...ctx} />}

          {overlay === 'log' && (
            <div style={{ position: 'absolute', inset: 0, zIndex: 20 }}>
              <LogTaskScreen
                prefillVehicleId={route.vehicleId}
                onClose={() => setOverlay(null)}
                onSaved={() => { setOverlay(null); setToast('Task logged ✓'); }}
              />
            </div>
          )}
          {overlay === 'fuel' && (
            <div style={{ position: 'absolute', inset: 0, zIndex: 20 }}>
              <FuelScreen
                onClose={() => setOverlay(null)}
                onSaved={() => { setOverlay(null); setToast('Fill-up logged ✓'); }}
              />
            </div>
          )}

          {/* floating fuel button so it's always reachable (tablet-in-shop pattern) */}
          {!overlay && (
            <div onClick={() => setOverlay('fuel')} style={{
              position: 'absolute', right: 22, bottom: 22, zIndex: 10,
              padding: '10px 14px', borderRadius: 30, background: WDW.orange, color: '#fff',
              boxShadow: '0 8px 20px rgba(232,92,43,0.35)',
              display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, fontWeight: 500, cursor: 'pointer',
              fontFamily: WDW.sans,
            }}>
              {I.camera} Snap fill-up
            </div>
          )}

          {/* Quick route pill (for reviewer — hidden chrome) */}
          <QuickNav route={route} go={go} parts={() => go('parts')} />

          {toast && (
            <div style={{
              position: 'absolute', left: '50%', bottom: 80, transform: 'translateX(-50%)', zIndex: 30,
              background: WDW.ink, color: '#fff', padding: '9px 16px', borderRadius: 20,
              fontSize: 13, fontFamily: WDW.sans, boxShadow: '0 8px 20px rgba(0,0,0,0.22)',
            }}>{toast}</div>
          )}
        </div>
      );
    }

    function QuickNav({ route, go }) {
      // Tiny reviewer-facing nav strip so you can jump between screens without going through links.
      const { WDW } = window;
      const cur = route.screen;
      const items = [
        ['fleet',     'Fleet'],
        ['vehicle',   'Vehicle'],
        ['reminders', 'Reminders'],
        ['parts',     'Parts'],
        ['expenses',  'Reports'],
        ['inbox',     'Inbox'],
        ['settings',  'Settings'],
      ];
      return (
        <div style={{
          position: 'absolute', left: 22, bottom: 22, zIndex: 10,
          display: 'flex', alignItems: 'center', gap: 2,
          background: WDW.ink, padding: 4, borderRadius: 20,
          fontFamily: WDW.sans, boxShadow: '0 8px 20px rgba(0,0,0,0.24)',
        }}>
          <div style={{ color: '#fff', fontSize: 10, fontWeight: 600, letterSpacing: 0.6, textTransform: 'uppercase', padding: '0 10px' }}>Jump to</div>
          {items.map(([k, label]) => (
            <div key={k} onClick={() => go(k, k === 'vehicle' ? { vehicleId: route.vehicleId || 'f250' } : {})} style={{
              padding: '5px 12px', borderRadius: 16, fontSize: 11.5, fontWeight: 500, cursor: 'pointer',
              background: cur === k ? '#fff' : 'transparent',
              color: cur === k ? WDW.ink : '#d5d7d9',
            }}>{label}</div>
          ))}
        </div>
      );
    }

    // Wait for all external babel scripts to finish populating window before mounting
    function mount() {
      if (!window.FleetScreen || !window.WDW || !window.ProfileScreen) { setTimeout(mount, 30); return; }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
    mount();
  </script>
</body>
</html>
